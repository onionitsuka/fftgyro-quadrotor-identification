[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fftgyro-quad-sitl-id"
version = "0.1.0"
description = "Research tooling for FFT GYRO quadrotor identification and SITL validation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fftgyro-exp = "fftgyro_quad_id.experiment_runner.cli:main"

[project.optional-dependencies]
hardware = [
    "pyserial>=3.5",
    "pymavlink>=2.4.49",
]
analysis = [
    "numpy>=1.25",
    "matplotlib>=3.7",
    "pyarrow>=16",
    "pyulog>=1.2",
    "scipy>=1.11",
    "pandas>=2.2",
]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
kinematics-check = ["mujoco>=3.6,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fftgyro_quad_id"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
